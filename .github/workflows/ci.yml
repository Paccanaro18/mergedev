name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token can only read the repo. No job here needs more.
permissions:
  contents: read

jobs:
  # Decides which parts of the repo a change touches, so the app and the landing
  # page are only checked when they changed. Plain `git diff`, no third-party action.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      landing: ${{ steps.diff.outputs.landing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi

          # Unknown base (first push, force push): check everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="apps/landing/package.json package-lock.json packages/"
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          echo "Changed files:"; echo "$files"

          app=false
          landing=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              apps/landing/*) landing=true ;;
              # Shared files affect both.
              package.json|package-lock.json|.github/workflows/ci.yml) app=true; landing=true ;;
              docs/*|*.md) ;;  # documentation alone needs no build
              *) app=true ;;
            esac
          done <<< "$files"

          # The landing page is only built once it exists.
          [ -f apps/landing/package.json ] || landing=false

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "landing=$landing" >> "$GITHUB_OUTPUT"

  app:
    name: Typecheck, build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # CI never launches Electron, so skip downloading its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck and build packages
        run: npx tsc -b

      - name: Typecheck desktop app
        run: npm run typecheck -w @merge/desktop

      - name: Build desktop app
        run: npx electron-vite build
        working-directory: apps/desktop

      - name: Test packages
        run: npm test --workspaces --if-present

  landing:
    name: Build landing page
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the landing build does not need install scripts (e.g. Electron's binary download).
      - run: npm ci --ignore-scripts

      - run: npm run build -w @merge/landing

  # The single check branch protection requires. It always runs; a skipped area counts as fine,
  # a failed or cancelled one does not.
  ci-ok:
    name: CI OK
    needs: [changes, app, landing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A required area failed."; exit 1 ;;
          esac
