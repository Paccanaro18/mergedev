name: Package

# Builds the desktop installers on Windows, macOS and Linux.
# - On pull requests that touch the app or the packaging: a dry run, so a broken installer
#   build is seen before a release (artifacts are kept for a few days, never published).
# - Called by the release workflow, which publishes the files to a GitHub Release.
# Installers are NOT code signed in the MVP. No secrets are used here.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/package.yml"
  workflow_call:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builder: --win nsis
            file: Merge-Setup.exe
          - name: macOS
            os: macos-latest
            builder: --mac dmg
            file: Merge.dmg
          - name: Linux
            os: ubuntu-latest
            builder: --linux AppImage
            file: Merge.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # electron-builder downloads the Electron it packages itself.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the app
        run: npm run build -w @merge/desktop

      - name: Build the installer
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # Never look for a signing identity: the MVP ships unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Check the installer has the name the landing page links to
        shell: bash
        working-directory: apps/desktop/release
        env:
          EXPECTED: ${{ matrix.file }}
        run: |
          ls -la
          test -f "$EXPECTED" || { echo "Missing $EXPECTED"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: apps/desktop/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
