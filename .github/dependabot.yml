version: 2

updates:
  # npm workspaces: one lockfile at the root covers packages/* and apps/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # Minor and patch updates in a single PR; majors stay separate so they get a proper look.
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins in the workflows current (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: scope
